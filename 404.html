<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening PDF</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f3f7f6;
      color: #14262c;
    }
    main {
      text-align: center;
      padding: 1.5rem;
      max-width: 24rem;
    }
    a { color: #0c5854; font-size: 1.125rem; }
    .status { color: #4d6368; margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="status" id="status">Opening PDF…</p>
    <p id="fallback" class="hidden">
      <a id="link" href="#">Open PDF</a>
    </p>
  </main>
  <script src="/assets/download.js" defer></script>
</body>
</html>
