<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f7f7f5;
      color: #1a1a1a;
    }
    main {
      text-align: center;
      padding: 1.5rem;
      max-width: 24rem;
    }
    a { color: #0b57d0; font-size: 1.125rem; }
    .status { color: #555; margin-bottom: 1rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="status" id="status">Preparing download…</p>
    <p id="fallback" class="hidden">
      <a id="link" href="#">Tap to open PDF</a>
    </p>
  </main>
  <script src="/assets/download.js" defer></script>
</body>
</html>
