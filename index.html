  <style>
    /* Fraunces, SIL Open Font License. Same face as biradarakshay.com. */
    @font-face {
      font-family: "Fraunces Variable";
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url("assets/fonts/fraunces-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --paper: #f4f1ea;
      --paper-raised: #fbf9f4;
      --ink: #2c3332;
      --muted: #5c6563;
      --line: #ddd6cc;
      --blue: #3c6e72;
      --blue-deep: #2a5154;
      --yellow: #e0c27a;
      --display: "Fraunces Variable", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", "Segoe UI Mono", ui-monospace, monospace;
      --focus: 3px solid var(--ink);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    h1,
    p { margin: 0; }

    h1 {
      font-family: var(--display);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.08;
      font-size: clamp(2.15rem, 6vw, 3.2rem);
      max-width: 16ch;
    }

    a {
      color: var(--blue-deep);
      text-underline-offset: 0.18em;
    }

    a:hover { color: var(--blue); }

    :focus-visible {
      outline: var(--focus);
      outline-offset: 3px;
    }

    .stripe {
      display: flex;
      height: 8px;
    }

    .stripe span:nth-child(1) { flex: 1; background: var(--ink); }
    .stripe span:nth-child(2) { width: 18%; background: var(--blue); }
    .stripe span:nth-child(3) { width: 10%; background: var(--yellow); }

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .header-inner,
    .tool {
      width: min(40rem, calc(100% - 2rem));
      margin-inline: auto;
    }

    .header-inner { padding: 0.85rem 0; }

    .wordmark {
      color: var(--ink);
      text-decoration: none;
      font-family: var(--display);
      font-weight: 560;
      letter-spacing: -0.03em;
      font-size: 1.35rem;
      line-height: 1.08;
    }

    .wordmark:hover { color: var(--ink); }

    .tool { padding: 2.5rem 0 3.5rem; }

    .index-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.8rem;
    }

    .index {
      display: inline-block;
      background: var(--yellow);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.4rem;
    }

    .kicker {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .lede {
      max-width: 62ch;
      margin-top: 1rem;
    }

    .field {
      display: grid;
      gap: 0.35rem;
      margin-top: 1.5rem;
    }

    .field label {
      font-family: var(--mono);
      font-size: 0.78rem;
    }

    textarea {
      width: 100%;
      min-height: 8rem;
      padding: 0.65rem 0.7rem;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--paper-raised);
      color: var(--ink);
      font: 1rem/1.4 var(--sans);
      resize: vertical;
      appearance: none;
    }

    textarea:focus { outline: none; }

    textarea:focus-visible {
      outline: var(--focus);
      outline-offset: 3px;
    }

    .message {
      margin-top: 0.75rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.85rem;
    }

    .message:empty { display: none; }

    .message[data-kind="error"] {
      width: fit-content;
      max-width: 100%;
      margin-top: 0.75rem;
      padding: 0.25rem 0.45rem;
      background: var(--yellow);
      color: var(--ink);
    }

    .sketch-frame {
      display: grid;
      width: min(100%, 18.5rem);
      margin-top: 1.25rem;
    }

    .sketch-frame[hidden] { display: none; }

    .sketch-offset,
    .sketch { grid-area: 1 / 1; }

    .sketch-offset {
      margin: 0.85rem 0 0 0.85rem;
      background: var(--yellow);
    }

    .sketch {
      margin: 0 0.85rem 0.85rem 0;
      background: var(--paper-raised);
      border: 1px solid var(--ink);
      padding: 0.75rem;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      background: #fff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 44px;
      padding: 0.65rem 1rem;
      border: 2px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font: 600 1rem/1 var(--sans);
      cursor: pointer;
    }

    button::after {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      background: var(--yellow);
      flex: none;
    }

    button:hover {
      background: var(--blue-deep);
      border-color: var(--blue-deep);
      color: #fff;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--ink);
    }

    button.secondary::after { content: none; }

    button.secondary:hover {
      background: var(--ink);
      color: var(--paper);
    }

    button:disabled,
    button:disabled:hover {
      opacity: 0.45;
      cursor: default;
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    button.secondary:disabled,
    button.secondary:disabled:hover {
      background: transparent;
      border-color: var(--ink);
      color: var(--ink);
    }

    @media (max-width: 899px) {
      .tool { padding: 1.75rem 0 2.25rem; }
    }

    @media (forced-colors: active) {
      textarea,
      button,
      .sketch { border: 1px solid ButtonText; }

      :focus-visible { outline: 3px solid Highlight; }
    }
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="https://www.biradarakshay.com/">Akshay Biradar</a>
    </div>
  </header>
  <main>
    <div class="tool">
      <p class="index-row">
        <span class="index">01</span>
        <span class="kicker">In the browser</span>
      </p>
      <h1>QR generator</h1>
      <p class="lede">Type any text or link. The code is created in this browser and stores that text directly. Nothing is uploaded, and scanning it does not redirect through this site.</p>
      <div class="field">
        <label for="text">Text</label>
        <textarea id="text" spellcheck="false" autofocus placeholder="Any text or link"></textarea>
      </div>
      <p class="message" id="message" role="status" data-kind="hint">Enter text to generate a code.</p>
      <div class="sketch-frame" id="preview" hidden>
        <div class="sketch-offset" aria-hidden="true"></div>
        <figure class="sketch">
          <canvas id="qr" aria-label="QR code"></canvas>
        </figure>
      </div>
      <div class="actions">
        <button type="button" id="png" disabled>Download PNG</button>
        <button type="button" id="svg" class="secondary" disabled>Download SVG</button>
      </div>
    </div>
  </main>
  <script src="assets/qr.js" defer></script>
</body>
</html>
